name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-go:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Run broker unit tests
        working-directory: broker
        run: go test ./cmd/api/... -v -count=1

      - name: Run toolbox unit tests
        working-directory: toolbox
        run: go test ./... -v -count=1

      - name: Run logger unit tests
        working-directory: logger
        run: go test ./cmd/api/... -v -count=1

      - name: Run listener unit tests
        working-directory: listener
        run: go test ./cmd/api/... -v -count=1

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Run integration tests
        working-directory: integration
        # The services the suite starts inherit this: self-hosted limits.
        env:
          LOGWOLF_EDITION: selfhosted
        run: go test -tags integration ./... -v -count=1 -timeout 5m

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm test

  build-images:
    name: Build the images from source
    runs-on: ubuntu-latest
    # Compose refuses to read its files without these; nothing runs, so any
    # value does.
    env:
      SESSION_SECRET: ci
      INTERNAL_API_SECRET: ci
      MONGO_USERNAME: ci
      MONGO_PASSWORD: ci
      RABBITMQ_USERNAME: ci
      RABBITMQ_PASSWORD: ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml alone pulls the published images; the override must
      # replace every one of them with a build.
      - name: Check the build override
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose config --quiet
          if docker compose config --images | grep '^ghcr.io/logwolf-app/'; then
            echo "docker-compose.build.yml leaves the services above on their published images" >&2
            exit 1
          fi

      - name: Build
        run: docker compose build
