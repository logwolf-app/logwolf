name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-go:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Run broker unit tests
        working-directory: broker
        run: go test ./cmd/api/... -v -count=1

      - name: Run toolbox unit tests
        working-directory: toolbox
        run: go test ./... -v -count=1

      - name: Run logger unit tests
        working-directory: logger
        run: go test ./cmd/api/... -v -count=1

      - name: Run listener unit tests
        working-directory: listener
        run: go test ./cmd/api/... -v -count=1

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Run integration tests
        working-directory: integration
        run: go test -tags integration ./... -v -count=1 -timeout 5m

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: frontend
        run: pnpm test
