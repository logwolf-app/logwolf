name: Release

on:
  release:
    types: [published]

jobs:
  openapi:
    name: Attach the OpenAPI spec
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release's tag, so the spec is the API of the release.
      - uses: actions/checkout@v4

      # In place of info.version's placeholder, leaving the rest as written.
      - name: Stamp the release's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          sed -i "s/^  version: unreleased$/  version: ${version}/" openapi.yaml
          grep -qx "  version: ${version}" openapi.yaml || { echo "openapi.yaml has no 'version: unreleased' under info" >&2; exit 1; }

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" openapi.yaml --clobber

  images:
    name: Publish the ${{ matrix.service }} image
    # Core releases only. The images are ghcr.io/logwolf-app/<service>, tagged
    # with the version and, for the latest release, latest.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: broker
            context: .
            dockerfile: broker/broker.dockerfile
          - service: listener
            context: .
            dockerfile: listener/listener.dockerfile
          - service: logger
            context: .
            dockerfile: logger/logger.dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/frontend.dockerfile
    steps:
      - uses: actions/checkout@v4

      # latest follows GitHub's "Latest" release, so a prerelease, or a patch to
      # an older line published without "Set as the latest release", leaves it
      # where it is. No latest release yet (only prereleases) answers 404.
      - name: Check whether this is the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name || true)
          if [ "$latest" = "$TAG" ]; then echo "latest=true"; else echo "latest=false"; fi >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          # A multi-arch image is an index: GHCR shows the index's annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/logwolf-app/${{ matrix.service }}
          # The version without its v, like the OpenAPI spec's.
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest }}
          flavor: latest=false
          labels: org.opencontainers.image.title=logwolf-${{ matrix.service }}
          annotations: org.opencontainers.image.title=logwolf-${{ matrix.service }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
