# Builds Logwolf's services from this checkout, in place of pulling the
# published images: for development, or to run changes of your own. Use it on
# top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build -d
#
# or, so that every docker compose command builds, set in .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml
#
# (on Windows, separate the files with ; instead). It needs Docker Compose 2.24
# or later. The images are named after the Compose project (logwolf-broker, ...),
# never after the published ones, so a build does not shadow a pulled release.
services:
  frontend:
    image: !reset null
    build:
      context: ./frontend
      dockerfile: ./frontend.dockerfile

  broker:
    image: !reset null
    build:
      context: .
      dockerfile: ./broker/broker.dockerfile

  logger:
    image: !reset null
    build:
      context: .
      dockerfile: ./logger/logger.dockerfile

  listener:
    image: !reset null
    build:
      context: .
      dockerfile: ./listener/listener.dockerfile
